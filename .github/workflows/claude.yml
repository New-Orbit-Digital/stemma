name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Claude Code
        id: claude
        # Mirrors ads-agent's revision-3 tool allowance, reduced to this repo's needs.
        # Same tradeoff as ads-agent: code execution in a job that holds
        # CLAUDE_CODE_OAUTH_TOKEN. Acceptable while issues here are written only by the planner.
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash(gh pr create*),Bash(gh pr comment*),Bash(gh pr view*),Bash(gh issue view*),Bash(python3 -c*),Bash(python3 tools/*.py*),Bash(python3 /tmp/*.py*),Bash(python3 -m py_compile*),Bash(python3 -m http.server*),Bash(node --check*),Bash(git fetch origin*),Bash(git merge origin/main*)"
          additional_permissions: |
            actions: read
